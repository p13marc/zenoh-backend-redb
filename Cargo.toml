[package]
name = "zenoh-backend-redb"
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
authors = ["Marc PARDO <p13marc@gmail.com>"]
license = "Apache-2.0 OR MIT"
description = "A Zenoh storage backend using redb embedded database"
repository = "https://git.marcpardo.eu/marcpardo/zenoh-backend-redb"
readme = "README.md"
keywords = ["zenoh", "storage", "backend", "redb", "database"]
categories = ["database", "network-programming"]

[lib]
name = "zenoh_backend_redb"
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin"]
plugin = ["dynamic_plugin"]
dynamic_plugin = []

[dependencies]
# Core database
redb = { version = "5.0", features = ["cache_metrics"] }

# Zenoh dependencies
zenoh = { version = "=1.10.2", features = ["plugins", "unstable", "internal"] }
zenoh-plugin-trait = "=1.10.2"
zenoh_backend_traits = { version = "=1.10.2", default-features = false }
zenoh-util = "=1.10.2"
zenoh-ext = { version = "=1.10.2", features = ["unstable"] }

# Async support
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"



[dev-dependencies]
tempfile = "3.8"
tracing-subscriber = "0.3"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"

[[bench]]
name = "storage_benchmarks"
harness = false

# redb optimised in debug builds too. The retention and durability tests write
# hundreds of thousands of samples, one commit each, and nearly all of that time is
# spent inside redb: unoptimised, the memory test alone takes minutes.
[profile.dev.package.redb]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
